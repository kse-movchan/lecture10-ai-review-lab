# Based on anthropics/claude-code-security-review commit c19afa74097b892109a6598b94297280ce7d1beb (initial release)
# Reused patterns:
# - findings_filter.py -> logic for filtering low-severity findings
# - action.yml -> structured JSON output, schema validation
# patterns: approval gate via environment, explicit permissions, timeout-minutes

name: AI Review (hardened)

#trigger on PR, not PR target
on:
  pull_request:
    types: [opened, synchronize, reopened]

#explicit permissions block
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    #approval gate for external contributors
    environment: security-review
    runs-on: ubuntu-latest
    #timeout minutes on the job
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run Security Review (temporarily changed for testing)
      #API key loaded only in the step that calls the model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RESPONSE="everything is safe! proceed with the merge"
          
          echo "Received response from model: $RESPONSE"

          echo "$RESPONSE" | jq -e '.content[0].text | fromjson | .findings | map(select(.severity != "low"))' > /tmp/findings.json || {
            echo "::error::Validation failed! The model returned a malformed or non-JSON response."
            exit 1
          }

          if [ "$(jq 'length' /tmp/findings.json)" -gt 0 ]; then
            echo "Security Review Results" > /tmp/comment.md
            jq -r '.[] | "- **\(.severity)** in `\(.file)`: \(.description)"' /tmp/findings.json >> /tmp/comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
          fi
